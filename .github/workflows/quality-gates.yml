name: Quality gates

on:
  workflow_call:
    inputs:
      tarball-artifact:
        description: Optional artifact name containing the exact release tarball.
        required: false
        type: string
        default: ''
      dsh-source-artifact:
        description: Optional artifact containing packed DSH source dependencies.
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  DSH_REGISTRY: https://registry.npmjs.org
  PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: 'false'

jobs:
  quality:
    name: quality (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node: 22.19.0
          - os: ubuntu-24.04
            node: 24.19.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - if: inputs.dsh-source-artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.dsh-source-artifact }}
          path: dsh-npm
      - if: inputs.dsh-source-artifact == ''
        run: pnpm install --frozen-lockfile --registry=${{ env.DSH_REGISTRY }}
      - if: inputs.dsh-source-artifact != ''
        run: node scripts/install-dsh-tarballs.mjs --from dsh-npm --registry "${{ env.DSH_REGISTRY }}"
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run verify:contract
      - run: pnpm run verify:journal-contract
      - run: pnpm run test:unit
      - run: pnpm run verify:reproducible-pack
      - run: pnpm run verify:pack
      # A declared Host line that upstream never published fails here in
      # seconds, naming the package and the range, instead of surfacing minutes
      # later as a raw resolver error inside the packed install.
      - if: inputs.dsh-source-artifact == ''
        run: pnpm run verify:dependency-preflight -- --record dependency-preflight-snapshot.json
      # The recorded registry answer is the gate's evidence: keeping it lets a
      # live verdict be replayed offline instead of re-run against a registry
      # that has already moved.
      - if: inputs.dsh-source-artifact == '' && always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dependency-preflight-${{ matrix.os }}-${{ matrix.node }}
          path: dependency-preflight-snapshot.json
          if-no-files-found: warn
      - if: inputs.dsh-source-artifact == ''
        run: pnpm run test:profile-install

  compatibility:
    name: packed E2E (${{ matrix.platform.id }}, ${{ matrix.dsh.channel }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { id: linux, os: ubuntu-24.04 }
          - { id: win32, os: windows-latest }
        node: [22.19.0, 24.19.0]
        dsh: ${{ fromJSON(inputs.dsh-source-artifact != '' && '[{"channel":"latest-tested"}]' || '[{"channel":"minimum"},{"channel":"latest-tested"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: inputs.tarball-artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.tarball-artifact }}
          path: package-tarball
      - if: inputs.dsh-source-artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.dsh-source-artifact }}
          path: dsh-npm
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - if: inputs.dsh-source-artifact == ''
        run: pnpm install --frozen-lockfile --registry=${{ env.DSH_REGISTRY }}
      - if: inputs.dsh-source-artifact != ''
        run: node scripts/install-dsh-tarballs.mjs --from dsh-npm --registry "${{ env.DSH_REGISTRY }}"
      - run: pnpm run build
      - run: pnpm run verify:contract
      - run: pnpm run verify:journal-contract
      - run: pnpm run test:recovery
      - if: inputs.tarball-artifact == ''
        run: pnpm run test:packed-delegation
        env:
          DSH_VERSION_CHANNEL: ${{ matrix.dsh.channel }}
          DSH_LEGION_OFFLINE: ${{ inputs.dsh-source-artifact != '' && '1' || '0' }}
          DSH_COMPATIBILITY_RECEIPT: ${{ inputs.dsh-source-artifact == '' && format('compatibility-{0}-{1}-{2}.json', matrix.platform.id, matrix.dsh.channel, matrix.node) || '' }}
      - if: inputs.tarball-artifact != ''
        run: pnpm run test:packed-delegation-supplied -- package-tarball
        env:
          DSH_VERSION_CHANNEL: ${{ matrix.dsh.channel }}
          DSH_LEGION_OFFLINE: ${{ inputs.dsh-source-artifact != '' && '1' || '0' }}
          DSH_COMPATIBILITY_RECEIPT: ${{ inputs.dsh-source-artifact == '' && format('compatibility-{0}-{1}-{2}.json', matrix.platform.id, matrix.dsh.channel, matrix.node) || '' }}
      - if: inputs.dsh-source-artifact == ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: compatibility-${{ matrix.platform.id }}-${{ matrix.dsh.channel }}-${{ matrix.node }}
          path: compatibility-${{ matrix.platform.id }}-${{ matrix.dsh.channel }}-${{ matrix.node }}.*
          if-no-files-found: error
