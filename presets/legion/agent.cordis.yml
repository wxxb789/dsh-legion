# Ready-to-copy Legion preset for DeepSeek Harness 0.1.x.
# This is a USER preset template, not a Host composition.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are Legion, a senior coding coordinator powered by the {{model}} model.
      Your working directory is {{cwd}}. Solve small tasks directly. For focused
      parallel work, delegate by semantic Specialist and integrate the evidence.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: tool-subagent-list-agents
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

- id: tool-legion
  name: dsh-legion
  config:
    configVersion: 2
    # No activation adapter is bound, and the assessed DSH line lacks atomic run coordination.
    enableDurableRuns: false
    durableRunPolicy:
      maxStartsPerActivation: 8
      maxConcurrentTasks: 2
    toolName: legion
    defaultProfile: quick
    enableRunInBackground: true
    resourceRoots:
      bundled: resources
    guidance: >-
      Prefer quick for routine work. Use deep only for sustained reasoning or
      implementation. Use review after consequential changes.
    specialists:
      deep:
        description: Complex architecture, difficult debugging, and end-to-end implementation.
        subagentProvider: spawn
        routes:
          - id: primary
            provider: deepseek-official
            model: deepseek-v4-pro
            constraints:
              minContextTokens: 65536
              minEffectiveOutputTokens: 8192
          - id: fast-static
            provider: deepseek-official
            model: deepseek-v4-flash
            constraints:
              minContextTokens: 65536
              minEffectiveOutputTokens: 8192
            instructions: >-
              Preserve the deep Specialist's evidence and verification requirements
              while using the fallback route.
        persona: >-
          Work autonomously. Inspect the repository, identify invariants,
          implement carefully, and verify the result before reporting.
        maxDepth: 3
        defaultRunInBackground: true

      quick:
        description: Translation, codebase exploration, extraction, formatting, and summaries.
        subagentProvider: spawn
        routes:
          - id: primary
            provider: deepseek-official
            model: deepseek-v4-flash
            maxTokens: 8192
          - id: quality-static
            provider: deepseek-official
            model: deepseek-v4-pro
            maxTokens: 8192
        persona: >-
          Finish the focused task quickly. Return concise evidence and exact
          source paths.
        maxDepth: 2
        defaultRunInBackground: true

      review:
        description: Independent correctness, security, and maintainability review.
        subagentProvider: spawn
        routes:
          - id: primary
            provider: deepseek-official
            model: deepseek-v4-pro
            constraints:
              minContextTokens: 65536
              minEffectiveOutputTokens: 8192
          - id: fast-static
            provider: deepseek-official
            model: deepseek-v4-flash
            constraints:
              minContextTokens: 65536
              minEffectiveOutputTokens: 8192
            instructions: >-
              Keep the same adversarial evidence threshold on the fallback route.
        persona: >-
          Act as an adversarial reviewer. Report concrete findings with
          severity, evidence, and a practical fix. Do not praise or restate.
        toolFilter:
          allow: [read, glob, grep]
        maxDepth: 2
        defaultRunInBackground: false
        result: review-v1
        promptFiles:
          - root: bundled
            path: review.md

    cohorts:
      independent-review:
        description: One executor and one independent reviewer.
        members:
          executor: { profile: deep }
          reviewer: { profile: review }
        limits: { maxMembers: 2, maxConcurrentMembers: 1 }

      research-panel:
        description: Three independent researchers and one evidence synthesizer.
        members:
          researchers:
            profile: quick
            minParticipants: 2
            maxParticipants: 3
            tags: [research]
          synthesizer: { profile: deep }
        limits: { maxMembers: 4, maxConcurrentMembers: 3 }

      plan-execute-review:
        description: A planner/executor, independent reviewer, and bounded repair activation.
        members:
          planner: { profile: deep }
          executor: { profile: deep }
          reviewer: { profile: review }
        limits: { maxMembers: 3, maxConcurrentMembers: 1 }

    strategies:
      independent-review:
        description: Execute once and independently review the produced evidence.
        team: independent-review
        stages:
          - kind: delegate
            id: execute
            member: executor
            inputs: [{ artifact: objective, contract: objective-v1 }]
            output: { artifact: execution, contract: text }
            prompt: Execute the objective and return concrete evidence.
          - kind: delegate
            id: review
            member: reviewer
            inputs:
              - { artifact: objective, contract: objective-v1 }
              - { artifact: execution, contract: text }
            output: { artifact: review, contract: review-v1 }
            prompt: Independently review the execution evidence and return the configured review contract.
        completion: { artifact: review, contract: review-v1 }
        limits:
          maxAgents: 2
          maxConcurrent: 1
          deadlineMs: 900000
          maxOutputBytes: 524288
        memberFailure: fail

      research-panel:
        description: Run independent research in parallel and deterministically synthesize the panel.
        team: research-panel
        stages:
          - kind: fanout
            id: research
            member: researchers
            count: 3
            minSuccess: 2
            allowDegraded: true
            inputs: [{ artifact: objective, contract: objective-v1 }]
            output: { artifact: findings, contract: text }
            prompt: Investigate independently and return source-grounded findings.
          - kind: synthesize
            id: synthesis
            member: synthesizer
            inputs: [{ artifact: findings, contract: text, collection: true, optional: true }]
            output: { artifact: synthesis, contract: text }
            prompt: Synthesize the panel in canonical member order and preserve disagreement.
        completion: { artifact: synthesis, contract: text }
        limits:
          maxAgents: 4
          maxConcurrent: 3
          deadlineMs: 900000
          maxOutputBytes: 1048576
        memberFailure: allow-partial

      plan-execute-review:
        description: Plan, execute, review, then perform one bounded evidence-aware repair.
        team: plan-execute-review
        stages:
          - kind: delegate
            id: plan
            member: planner
            inputs: [{ artifact: objective, contract: objective-v1 }]
            output: { artifact: plan, contract: text }
            prompt: Produce a bounded execution plan.
          - kind: delegate
            id: execute
            member: executor
            inputs:
              - { artifact: objective, contract: objective-v1 }
              - { artifact: plan, contract: text }
            output: { artifact: execution, contract: text }
            prompt: Execute the plan and return evidence.
          - kind: delegate
            id: review
            member: reviewer
            inputs:
              - { artifact: plan, contract: text }
              - { artifact: execution, contract: text }
            output: { artifact: review, contract: review-v1 }
            prompt: Review plan adherence and execution evidence.
          - kind: delegate
            id: repair
            member: executor
            inputs:
              - { artifact: objective, contract: objective-v1 }
              - { artifact: plan, contract: text }
              - { artifact: execution, contract: text }
              - { artifact: review, contract: review-v1 }
            output: { artifact: final, contract: text }
            prompt: Perform one bounded repair from the review, or preserve the evidence when no repair is required.
        advancement:
          kind: stair-step
          plannerMember: planner
          verifierMember: reviewer
          advancement: checkpoint
          maxMilestones: 12
          maxNoProgressMilestones: 2
          requireVisibleArtifact: true
          pauseOn:
            - authority-expansion
            - irreversible-effect
            - high-cost-ambiguity
            - verification-failure
            - no-progress
        completion: { artifact: final, contract: text }
        limits:
          maxAgents: 4
          maxConcurrent: 1
          deadlineMs: 1800000
          maxOutputBytes: 1048576
        memberFailure: fail

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── presentation ────────────────────────────────────────────────────────────
#
# Native mode is deliberate: this preset includes a Review Specialist whose
# explicit read/glob/grep allowlist must be an actual read-only boundary. DSH's
# worker-thread PTC runtime filters generated SDK bindings, but run_code itself
# cannot be filtered and model code retains bash-equivalent Node API authority.
#
# The row is the official Host-owned presentation selector, never a Legion config
# key. Delegated children inherit this choice through the preset standing scope.
# Trusted deployments may change it to ptc only when every child is allowed that
# code-runtime authority; a Host-plane codeRuntime must then be composed first.
- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: native
