name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DSH_REGISTRY: https://registry.npmjs.org

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
      - run: node scripts/verify-dependency-preflight.mjs --record dependency-preflight-snapshot.json --output dependency-preflight-report.json
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dependency-preflight-release-${{ github.run_attempt }}
          path: |
            dependency-preflight-report.json
            dependency-preflight-snapshot.json
          if-no-files-found: warn

  pack:
    needs: dependency-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --registry=${{ env.DSH_REGISTRY }}
      - run: node scripts/verify-release.mjs "$GITHUB_REF_NAME"
      - run: pnpm run verify:reproducible-pack -- --source=git dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: package-tarball
          path: dist/*.tgz
          if-no-files-found: error
          overwrite: true

  gates:
    needs: pack
    uses: ./.github/workflows/quality-gates.yml
    with:
      tarball-artifact: package-tarball

  release:
    needs: [pack, gates]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-tarball
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: compatibility-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
      - run: |
          mapfile -t tarballs < <(find dist -maxdepth 1 -name '*.tgz' -type f)
          test "${#tarballs[@]}" -eq 2
          ROOT_TARBALL="$(find dist -maxdepth 1 -name 'dsh-legion-[0-9]*.tgz' -type f -print -quit)"
          COMPANION_TARBALL="$(find dist -maxdepth 1 -name 'dsh-legion-receipts-[0-9]*.tgz' -type f -print -quit)"
          test -n "$ROOT_TARBALL" && test -n "$COMPANION_TARBALL"
          echo "ROOT_TARBALL=$ROOT_TARBALL" >> "$GITHUB_ENV"
          echo "COMPANION_TARBALL=$COMPANION_TARBALL" >> "$GITHUB_ENV"
      - name: Verify npm recovery identity before publishing release evidence
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/publish-release.mjs "$COMPANION_TARBALL" "dsh-legion-receipts@$VERSION" "$DSH_REGISTRY" --check-only
          node scripts/publish-release.mjs "$ROOT_TARBALL" "dsh-legion@$VERSION" "$DSH_REGISTRY" --check-only
      - run: node scripts/verify-compatibility-receipts.mjs dist
      - run: mkdir -p dist/sbom-root && tar -xzf "$ROOT_TARBALL" -C dist/sbom-root
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist/sbom-root/package
          format: spdx-json
          output-file: dist/dsh-legion.spdx.json
          upload-artifact: false
      - run: mkdir -p dist/sbom-companion && tar -xzf "$COMPANION_TARBALL" -C dist/sbom-companion
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist/sbom-companion/package
          format: spdx-json
          output-file: dist/dsh-legion-receipts.spdx.json
          upload-artifact: false
      - run: rm -rf dist/sbom-root dist/sbom-companion && node scripts/hash-artifacts.mjs dist
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          overwrite: true
      - name: Stage recoverable GitHub draft release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish with npm Trusted Publishing and provenance
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/publish-release.mjs "$COMPANION_TARBALL" "dsh-legion-receipts@$VERSION" "$DSH_REGISTRY"
          node scripts/publish-release.mjs "$ROOT_TARBALL" "dsh-legion@$VERSION" "$DSH_REGISTRY"
      - name: Publish GitHub release after npm succeeds
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
