name: Quality gates

on:
  workflow_call:
    inputs:
      tarball-artifact:
        description: Optional artifact name containing the exact release tarball.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node: 22.19.0
            packedProfile: true
          - os: ubuntu-24.04
            node: 24.19.0
            packedProfile: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run verify:contract
      - run: pnpm run verify:journal-contract
      - run: pnpm run test:unit
      - run: pnpm run verify:reproducible-pack
      - run: pnpm run verify:pack
      # A declared Host line that upstream never published fails here in
      # seconds, naming the package and the range, instead of surfacing minutes
      # later as a raw resolver error inside the packed install.
      - if: matrix.packedProfile
        run: pnpm run verify:dependency-preflight -- --record dependency-preflight-snapshot.json
      # The recorded registry answer is the gate's evidence: keeping it lets a
      # live verdict be replayed offline instead of re-run against a registry
      # that has already moved.
      - if: matrix.packedProfile && always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dependency-preflight-${{ matrix.os }}-${{ matrix.node }}
          path: dependency-preflight-snapshot.json
          if-no-files-found: warn
      - if: matrix.packedProfile
        run: pnpm run test:profile-install

  compatibility:
    name: packed E2E (${{ matrix.platform.id }}, ${{ matrix.dsh.channel }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { id: linux, os: ubuntu-24.04 }
          - { id: win32, os: windows-latest }
        node: [22.19.0, 24.19.0]
        dsh:
          - channel: minimum
            version: 0.1.0-rc.6
          - channel: latest-tested
            version: 0.1.1-rc.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: inputs.tarball-artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.tarball-artifact }}
          path: package-tarball
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - run: pnpm run build
      - run: pnpm run verify:contract
      - run: pnpm run verify:journal-contract
      - run: pnpm run test:recovery
      - if: inputs.tarball-artifact == ''
        run: pnpm run test:packed-delegation
        env:
          DSH_VERSION: ${{ matrix.dsh.version }}
          DSH_COMPATIBILITY_RECEIPT: compatibility-${{ matrix.platform.id }}-${{ matrix.dsh.channel }}-${{ matrix.node }}.json
      - if: inputs.tarball-artifact != ''
        run: pnpm run test:packed-delegation-supplied -- package-tarball
        env:
          DSH_VERSION: ${{ matrix.dsh.version }}
          DSH_COMPATIBILITY_RECEIPT: compatibility-${{ matrix.platform.id }}-${{ matrix.dsh.channel }}-${{ matrix.node }}.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: compatibility-${{ matrix.platform.id }}-${{ matrix.dsh.channel }}-${{ matrix.node }}
          path: compatibility-${{ matrix.platform.id }}-${{ matrix.dsh.channel }}-${{ matrix.node }}.*
          if-no-files-found: error
