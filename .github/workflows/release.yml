name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-release.mjs "$GITHUB_REF_NAME"
      - run: pnpm run verify:reproducible-pack -- --source=git dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: package-tarball
          path: dist/*.tgz
          if-no-files-found: error

  gates:
    needs: pack
    uses: ./.github/workflows/quality-gates.yml
    with:
      tarball-artifact: package-tarball

  release:
    needs: [pack, gates]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-tarball
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: compatibility-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
      - run: |
          mapfile -t tarballs < <(find dist -maxdepth 1 -name '*.tgz' -type f)
          test "${#tarballs[@]}" -eq 1
          echo "RELEASE_TARBALL=${tarballs[0]}" >> "$GITHUB_ENV"
      - run: node scripts/verify-compatibility-receipts.mjs dist
      - run: mkdir -p dist/sbom-root && tar -xzf "$RELEASE_TARBALL" -C dist/sbom-root
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist/sbom-root/package
          format: spdx-json
          output-file: dist/dsh-legion.spdx.json
          upload-artifact: false
      - run: rm -rf dist/sbom-root && node scripts/hash-artifacts.mjs dist
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
      - name: Stage recoverable GitHub draft release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish with npm Trusted Publishing and provenance
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "dsh-legion@$VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "dsh-legion@$VERSION is already published; continuing recovery"
          else
            npm publish "$RELEASE_TARBALL" --access public --provenance
          fi
      - name: Publish GitHub release after npm succeeds
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
