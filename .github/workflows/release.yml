name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: release quality (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node: 22.19.0
            packedProfile: false
          - os: ubuntu-latest
            node: 24.x
            packedProfile: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - run: pnpm run check
      - if: matrix.packedProfile
        run: pnpm run test:profile-install

  compatibility:
    name: release packed E2E (${{ matrix.dsh.channel }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24.x]
        dsh:
          - channel: minimum
            version: 0.1.0-rc.6
          - channel: latest-compatible
            version: '>=0.1.0-rc.6 <0.2.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - run: pnpm run build
      - run: pnpm run test:packed-delegation
        env:
          DSH_VERSION: ${{ matrix.dsh.version }}

  release:
    needs: [quality, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - run: node scripts/verify-release.mjs "$GITHUB_REF_NAME"
      - run: pnpm run check
      - run: |
          mkdir -p dist/sbom-root
          npm pack --ignore-scripts --pack-destination dist
          tar -xzf dist/*.tgz -C dist/sbom-root
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist/sbom-root/package
          format: spdx-json
          output-file: dist/dsh-legion.spdx.json
          upload-artifact: false
      - run: rm -rf dist/sbom-root && node scripts/hash-artifacts.mjs dist
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
      - name: Publish with npm Trusted Publishing and provenance
        run: npm publish dist/*.tgz --access public --provenance
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
