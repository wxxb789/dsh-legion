<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dsh-legion social preview</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1280px; height:640px; overflow:hidden; background:#05070d; }
  .card {
    position:relative; width:1280px; height:640px; overflow:hidden;
    background:
      radial-gradient(900px 520px at 82% 12%, rgba(56,189,248,0.20), transparent 65%),
      radial-gradient(700px 480px at 8% 96%, rgba(129,140,248,0.16), transparent 62%),
      linear-gradient(145deg, #070b16 0%, #0a0f1f 55%, #05070d 100%);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
    color:#e8eefc;
  }
  .grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(148,178,230,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,178,230,0.055) 1px, transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image: radial-gradient(1000px 620px at 50% 40%, #000 30%, transparent 88%);
            mask-image: radial-gradient(1000px 620px at 50% 40%, #000 30%, transparent 88%);
  }
  .glow { position:absolute; right:-160px; top:-200px; width:620px; height:620px;
    background:radial-gradient(circle, rgba(34,211,238,0.28), transparent 62%); filter:blur(10px); }
  .accentbar { position:absolute; left:0; top:0; width:100%; height:6px;
    background:linear-gradient(90deg,#22d3ee 0%, #6366f1 50%, #a855f7 100%); }
  .inner { position:relative; padding:78px 88px 72px; height:100%; display:flex; flex-direction:column; }
  .eyebrow { display:inline-flex; align-items:center; gap:12px; font-size:19px; font-weight:600;
    letter-spacing:0.20em; text-transform:uppercase; color:#67e8f9; }
  .eyebrow .dot { width:11px; height:11px; border-radius:50%; background:#22d3ee;
    box-shadow:0 0 16px 4px rgba(34,211,238,0.55); }
  h1 { margin-top:26px; font-size:104px; line-height:1.02; font-weight:800; letter-spacing:-0.035em;
    background:linear-gradient(92deg,#ffffff 0%, #cfe4ff 46%, #8ed8f8 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tagline { margin-top:22px; font-size:35px; font-weight:500; line-height:1.32; color:#b9c9e6; max-width:960px; }
  .pills { margin-top:40px; display:flex; gap:16px; flex-wrap:wrap; }
  .pill { font-size:20px; font-weight:600; padding:12px 24px; border-radius:999px;
    border:1px solid rgba(103,232,249,0.34); background:rgba(34,211,238,0.09); color:#a5e9f7; white-space:nowrap; }
  .spacer { flex:1; }
  .footer { display:flex; align-items:flex-end; justify-content:space-between; }
  .url { font-family: "Cascadia Code", Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace;
    font-size:27px; color:#8fb6e8; letter-spacing:-0.005em; }
  .url .slash { color:#4f6a92; }
  .meta { display:flex; align-items:center; gap:14px; font-size:19px; font-weight:600; color:#7f93b5;
    font-family:"Cascadia Code", Consolas, "SF Mono", Menlo, monospace; }
  .meta .sep { color:#33455f; }
</style>
</head>
<body>
  <div class="card">
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="accentbar"></div>
    <div class="inner">
      <div><span class="eyebrow"><span class="dot"></span>DeepSeek Harness plugin</span></div>
      <h1>dsh-legion</h1>
      <div class="tagline">Multi-agent teams and model routing for DeepSeek Harness</div>
      <div class="pills">
        <span class="pill">Profiles</span>
        <span class="pill">Model routing</span>
        <span class="pill">Teams &amp; Strategies</span>
        <span class="pill">Bounded delegation</span>
      </div>
      <div class="spacer"></div>
      <div class="footer">
        <div class="url">github.com<span class="slash">/</span>wxxb789<span class="slash">/</span>dsh-legion</div>
        <div class="meta"><span>TypeScript</span><span class="sep">&bull;</span><span>MIT</span></div>
      </div>
    </div>
  </div>
</body>
</html>
