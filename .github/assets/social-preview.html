<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dsh-legion social preview A</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1280px; height:640px; overflow:hidden; background:#0a0c10; }
  .card {
    position:relative; width:1280px; height:640px; overflow:hidden;
    background:
      radial-gradient(760px 420px at 88% 8%, rgba(217,160,74,0.13), transparent 68%),
      radial-gradient(620px 420px at 4% 100%, rgba(120,140,180,0.10), transparent 64%),
      linear-gradient(160deg, #0d1016 0%, #0a0d13 60%, #07090d 100%);
    font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
    color:#e9edf5;
  }
  .grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(150,170,205,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(150,170,205,0.05) 1px, transparent 1px);
    background-size:80px 80px;
    -webkit-mask-image: radial-gradient(1100px 700px at 30% 45%, #000 25%, transparent 85%);
  }
  .accentbar { position:absolute; left:0; top:0; width:100%; height:5px;
    background:linear-gradient(90deg,#d9a04a 0%, #c8763c 45%, #6f7f9d 100%); }
  .inner { position:relative; height:100%; padding:70px 76px 62px; display:flex; gap:56px; }
  .left { width:600px; display:flex; flex-direction:column; }
  .eyebrow { display:inline-flex; align-items:center; gap:11px; font-size:17px; font-weight:700;
    letter-spacing:0.2em; text-transform:uppercase; color:#e0b276; }
  .eyebrow .dot { width:9px; height:9px; background:#d9a04a; transform:rotate(45deg);
    box-shadow:0 0 14px 3px rgba(217,160,74,0.45); }
  h1 { margin-top:24px; font-size:96px; line-height:1.16; padding-bottom:6px; font-weight:800;
    letter-spacing:-0.035em; color:#f6f8fc; }
  h1 .dash { color:#d9a04a; }
  .tag { margin-top:10px; font-size:33px; font-weight:600; line-height:1.3; color:#cfd8e8; }
  .desc { margin-top:20px; font-size:20px; line-height:1.55; color:#93a1ba; max-width:560px; }
  .spacer { flex:1; }
  .foot { display:flex; flex-direction:column; gap:13px; }
  .url { font-family:"Cascadia Code", Consolas, "DejaVu Sans Mono", monospace; font-size:23px; color:#8fa2c0; }
  .url .s { color:#4c5b74; }
  .meta { font-family:"Cascadia Code", Consolas, monospace; font-size:17px; font-weight:600; color:#66748d; letter-spacing:0.04em; }
  .right { flex:1; display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
  <div class="card">
    <div class="grid"></div>
    <div class="accentbar"></div>
    <div class="inner">
      <div class="left">
        <div><span class="eyebrow"><span class="dot"></span>DeepSeek Harness plugin</span></div>
        <h1>dsh<span class="dash">-</span>legion</h1>
        <div class="tag">One tool. Many agents.<br>Exact model routes.</div>
        <div class="desc">Semantic profiles, declarative teams and strategies, and bounded subagent delegation &mdash; compiled to native DSH subagents.</div>
        <div class="spacer"></div>
        <div class="foot">
          <div class="url">github.com<span class="s">/</span>wxxb789<span class="s">/</span>dsh-legion</div>
          <div class="meta">TypeScript &nbsp;&bull;&nbsp; MIT &nbsp;&bull;&nbsp; no extra runtime</div>
        </div>
      </div>
      <div class="right">
        <svg width="470" height="470" viewBox="0 0 470 470" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="cardg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#161c27"/><stop offset="1" stop-color="#111621"/>
            </linearGradient>
          </defs>
          <!-- coordinator -->
          <rect x="115" y="6" width="240" height="66" rx="15" fill="url(#cardg)" stroke="#2c3648" stroke-width="1.5"/>
          <text x="235" y="45" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="600" fill="#dbe3f0">coordinator agent</text>
          <path d="M235 72 V118" stroke="#3a465c" stroke-width="2"/>
          <!-- legion tool -->
          <rect x="128" y="118" width="214" height="52" rx="26" fill="#1d1710" stroke="#8c6a34" stroke-width="1.6"/>
          <text x="235" y="151" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace" font-size="20" font-weight="600" fill="#e6b878">legion(profile)</text>
          <path d="M235 170 V204" stroke="#3a465c" stroke-width="2"/>
          <path d="M68 204 H402" stroke="#3a465c" stroke-width="2"/>
          <path d="M68 204 V244 M235 204 V244 M402 204 V244" stroke="#3a465c" stroke-width="2"/>
          <!-- profile cards -->
          <g>
            <rect x="4" y="244" width="128" height="120" rx="14" fill="url(#cardg)" stroke="#2c3648" stroke-width="1.5"/>
            <text x="68" y="288" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#f0f4fa">quick</text>
            <text x="68" y="320" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace" font-size="15" fill="#8b9ab4">fast model</text>
            <text x="68" y="344" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace" font-size="15" fill="#8b9ab4">depth 2</text>
          </g>
          <g>
            <rect x="171" y="244" width="128" height="120" rx="14" fill="url(#cardg)" stroke="#2c3648" stroke-width="1.5"/>
            <text x="235" y="288" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#f0f4fa">deep</text>
            <text x="235" y="320" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace" font-size="15" fill="#8b9ab4">4 routes</text>
            <text x="235" y="344" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace" font-size="15" fill="#8b9ab4">background</text>
          </g>
          <g>
            <rect x="338" y="244" width="128" height="120" rx="14" fill="url(#cardg)" stroke="#8c6a34" stroke-width="1.5"/>
            <text x="402" y="288" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#f0f4fa">review</text>
            <text x="402" y="320" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace" font-size="15" fill="#c9a066">read-only</text>
            <text x="402" y="344" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace" font-size="15" fill="#c9a066">review-v1</text>
          </g>
          <path d="M68 364 V400 M235 364 V400 M402 364 V400" stroke="#3a465c" stroke-width="2" stroke-dasharray="5 6"/>
          <path d="M68 400 H402" stroke="#3a465c" stroke-width="2"/>
          <path d="M235 400 V424" stroke="#3a465c" stroke-width="2"/>
          <rect x="115" y="424" width="240" height="44" rx="12" fill="#0f141d" stroke="#2c3648" stroke-width="1.5"/>
          <text x="235" y="452" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#93a1ba" letter-spacing="1">NATIVE DSH SUBAGENTS</text>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
