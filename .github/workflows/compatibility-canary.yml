name: Compatibility canary

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  DSH_REGISTRY: https://registry.npmjs.org

jobs:
  rolling-compatible:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --registry=$DSH_REGISTRY
      - run: pnpm run build
      - run: pnpm run verify:dependency-preflight
      - run: pnpm run test:packed-delegation
        env:
          DSH_VERSION_CHANNEL: peer-range
          DSH_COMPATIBILITY_RECEIPT: compatibility-rolling-compatible-24.19.0.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: compatibility-rolling-compatible-24.19.0
          path: compatibility-rolling-compatible-24.19.0.*
          if-no-files-found: error
