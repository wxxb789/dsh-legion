name: Quality gates

on:
  workflow_call:
    inputs:
      tarball-artifact:
        description: Optional artifact name containing the exact release tarball.
        required: false
        type: string
        default: ''
      dsh-source-artifact:
        description: Optional artifact containing packed DSH source dependencies.
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  DSH_REGISTRY: https://registry.npmjs.org
  PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: 'false'

jobs:
  dependency-preflight:
    name: registry dependency preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
      - if: inputs.dsh-source-artifact == ''
        run: node scripts/verify-dependency-preflight.mjs --record dependency-preflight-snapshot.json --output dependency-preflight-report.json
      - if: inputs.dsh-source-artifact == '' && always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dependency-preflight-quality-${{ github.run_attempt }}
          path: |
            dependency-preflight-report.json
            dependency-preflight-snapshot.json
          if-no-files-found: warn

  quality:
    needs: dependency-preflight
    name: quality (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DSH_LEGION_DSH_TEST_SOURCE: ${{ github.workspace }}/dsh-test-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node: 22.19.0
          - os: ubuntu-24.04
            node: 24.19.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - id: dsh-test-source
        run: >-
          node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'tag=dsh-v' + require('./contracts/compatibility.json').latestTestedDshVersion + '\n')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.dsh-test-source.outputs.tag }}
          path: dsh-test-source
          sparse-checkout: |
            packages/client/ui-chat/src
            packages/client/ui-conversation/src
            packages/client/ui-renderer/src
            packages/client/ui-session/src
          sparse-checkout-cone-mode: false
      - if: inputs.dsh-source-artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.dsh-source-artifact }}
          path: ${{ runner.temp }}/dsh-npm
      - if: inputs.dsh-source-artifact == ''
        run: pnpm install --frozen-lockfile --registry=${{ env.DSH_REGISTRY }}
      - if: inputs.dsh-source-artifact != ''
        run: pnpm exec node scripts/install-dsh-tarballs.mjs --from "${{ runner.temp }}/dsh-npm" --registry "${{ env.DSH_REGISTRY }}"
      - if: inputs.dsh-source-artifact != ''
        run: pnpm exec node scripts/verify-dependency-preflight.mjs --non-applicable "source installer rewrote every workspace DSH edge to supplied tarballs" --output dependency-preflight-report.json
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test:composition:built
      - run: pnpm run verify:contract
      - run: pnpm run verify:journal-contract
      - run: pnpm run test:unit
      - run: pnpm run verify:reproducible-pack
      - run: pnpm run verify:pack
      - if: inputs.dsh-source-artifact == ''
        run: pnpm run test:profile-install

  compatibility:
    needs: dependency-preflight
    name: packed E2E (${{ matrix.platform.id }}, ${{ matrix.dsh.channel }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { id: linux, os: ubuntu-24.04 }
          - { id: win32, os: windows-latest }
        node: [22.19.0, 24.19.0]
        dsh: ${{ fromJSON(inputs.dsh-source-artifact != '' && '[{"channel":"latest-tested"}]' || '[{"channel":"minimum"},{"channel":"latest-tested"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: inputs.tarball-artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.tarball-artifact }}
          path: package-tarball
      - if: inputs.dsh-source-artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.dsh-source-artifact }}
          path: ${{ runner.temp }}/dsh-npm
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - if: inputs.dsh-source-artifact == ''
        run: pnpm install --frozen-lockfile --registry=${{ env.DSH_REGISTRY }}
      - if: inputs.dsh-source-artifact != ''
        run: pnpm exec node scripts/install-dsh-tarballs.mjs --from "${{ runner.temp }}/dsh-npm" --registry "${{ env.DSH_REGISTRY }}"
      - if: inputs.dsh-source-artifact != ''
        run: pnpm exec node scripts/verify-dependency-preflight.mjs --non-applicable "source installer rewrote every workspace DSH edge to supplied tarballs" --output dependency-preflight-report.json
      - run: pnpm run build
      - run: pnpm run verify:contract
      - run: pnpm run verify:journal-contract
      - run: pnpm run test:recovery
      - if: inputs.tarball-artifact == ''
        run: pnpm run test:packed-delegation
        env:
          DSH_VERSION_CHANNEL: ${{ matrix.dsh.channel }}
          DSH_LEGION_OFFLINE: ${{ inputs.dsh-source-artifact != '' && '1' || '0' }}
          DSH_COMPATIBILITY_RECEIPT: ${{ inputs.dsh-source-artifact == '' && format('compatibility-{0}-{1}-{2}.json', matrix.platform.id, matrix.dsh.channel, matrix.node) || '' }}
      - if: inputs.tarball-artifact != ''
        run: pnpm run test:packed-delegation-supplied -- package-tarball
        env:
          DSH_VERSION_CHANNEL: ${{ matrix.dsh.channel }}
          DSH_LEGION_OFFLINE: ${{ inputs.dsh-source-artifact != '' && '1' || '0' }}
          DSH_COMPATIBILITY_RECEIPT: ${{ inputs.dsh-source-artifact == '' && format('compatibility-{0}-{1}-{2}.json', matrix.platform.id, matrix.dsh.channel, matrix.node) || '' }}
      - if: inputs.dsh-source-artifact == ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: compatibility-${{ matrix.platform.id }}-${{ matrix.dsh.channel }}-${{ matrix.node }}
          path: |
            compatibility-${{ matrix.platform.id }}-${{ matrix.dsh.channel }}-${{ matrix.node }}.json
            compatibility-${{ matrix.platform.id }}-${{ matrix.dsh.channel }}-${{ matrix.node }}.lock.yaml
          if-no-files-found: error
          overwrite: true
